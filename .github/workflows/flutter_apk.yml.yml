
  name: Flutter APK Build

  on:
    push:
      branches:
        - main
        - Rabbi

    workflow_dispatch:

  jobs:
    build-apk:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        # 1. Setup Java 17 for Gradle
        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'

        # 2. Setup Flutter
        - name: Setup Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: '3.44.1'
            channel: stable
            cache: true

        - name: Check Flutter
          run: flutter --version

        - name: Get Dependencies
          run: flutter pub get

        - name: Analyze Project
          run: flutter analyze

        # 3. Check Android Signing Certificate
        - name: Check Android Signing Certificate
          run: |
            cd android
            chmod +x gradlew
            ./gradlew signingReport

        # 4. Build APK
        - name: Build APK
          run: flutter build apk --release

        # 5. Upload APK
        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: Inspexion-AI-APK
            path: build/app/outputs/flutter-apk/app-release.apk

