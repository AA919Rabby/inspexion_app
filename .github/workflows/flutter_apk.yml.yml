name: Flutter APK Build

on:
  push:
    branches:
      - main
      - Rabbi

  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 👉 1. Create .env IMMEDIATELY so flutter analyze sees it
      - name: Create .env file
        run: echo "BASE_URL=${{ secrets.BASE_URL }}" > .env

      # 2. Setup Java 17 for Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      # 4. Analyze Project (with --no-fatal-warnings to prevent build blocks)
      - name: Analyze Project
        run: flutter analyze --no-fatal-warnings

      # 5. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inspexion-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk